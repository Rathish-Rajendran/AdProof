[project]
name = "adproof"
version = "0.1.0"
description = "Evidence-backed preflight and repair agent for AI-generated advertising"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "google-genai==2.31.0",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "sentry-sdk==2.72.0",
  "uagents==0.25.5",
]

[project.scripts]
adproof-preflight = "adproof.preflight:main"
adproof-live-smoke = "adproof.live_smoke:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["legacy/mock-demo"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adproof", "agents"]
