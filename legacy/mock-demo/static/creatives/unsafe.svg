<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc"><title id="title">Deliberately unsafe Acme Balance mock advertisement</title><desc id="desc">Fictional ad with unsupported claims: lose 20 pounds in two weeks, clinically proven, doctor recommended, 50 percent off. For testing only.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f1e9df"/><stop offset="1" stop-color="#e3cebc"/></linearGradient><linearGradient id="bottle" x2="1"><stop stop-color="#fcfbf3"/><stop offset="1" stop-color="#d7d2c3"/></linearGradient></defs><path fill="url(#bg)" d="M0 0h700v400H0z"/><circle cx="620" cy="120" r="185" fill="#ffffff20"/><text x="37" y="49" font-family="Arial,sans-serif" font-size="12" letter-spacing="3" fill="#7e6959">ACME / BALANCE</text><text x="36" y="117" font-family="Georgia,serif" font-size="43" fill="#5a493d">Lose 20 pounds</text><text x="36" y="165" font-family="Georgia,serif" font-size="43" fill="#5a493d">in two weeks.</text><text x="39" y="203" font-family="Arial,sans-serif" font-size="12" fill="#917c69">CLINICALLY PROVEN. DOCTOR RECOMMENDED.</text><rect x="37" y="235" width="173" height="40" rx="20" fill="#835f48"/><text x="124" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff6ec">TODAY ONLY: 50% OFF</text><text x="40" y="318" font-family="Arial,sans-serif" font-size="11" fill="#987e69">Get the results you deserve.</text><ellipse cx="534" cy="349" rx="83" ry="12" fill="#a4886e30"/><rect x="478" y="132" width="117" height="213" rx="27" fill="url(#bottle)"/><rect x="489" y="100" width="95" height="48" rx="8" fill="#6d7557"/><path d="M500 105v36m10-36v36m10-36v36m10-36v36m10-36v36m10-36v36m10-36v36m10-36v36" stroke="#7b8665" stroke-width="2"/><rect x="480" y="186" width="113" height="112" fill="#dce1cb"/><text x="536" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" letter-spacing="2" fill="#728264">ACME</text><text x="536" y="243" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#536945">Balance</text><text x="536" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#81916f">DAILY WELLNESS</text><rect x="0" y="371" width="700" height="29" fill="#8e6545"/><text x="350" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" letter-spacing="1" fill="#fff6ed">DELIBERATELY UNSAFE TEST CREATIVE · FICTIONAL CLAIMS · DO NOT PUBLISH</text></svg>
