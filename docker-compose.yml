services:
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  runtime-prepare:
    build: .
    command: ["uv", "run", "python", "scripts/prepare_runtime.py"]
    env_file: .env
    environment:
      ADPROOF_RUNTIME_DIR: /runtime
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - runtime:/runtime

  verifier:
    build: .
    command: ["uv", "run", "python", "-m", "agents.verifier.main"]
    env_file: .env
    environment:
      ADPROOF_RUNTIME_DIR: /runtime
      OLLAMA_BASE_URL: http://ollama:11434
      VERIFIER_HOST: verifier
      ORCHESTRATOR_HOST: orchestrator
      REMEDIATOR_HOST: remediator
    volumes:
      - runtime:/runtime
    depends_on:
      runtime-prepare:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  remediator:
    build: .
    command: ["uv", "run", "python", "-m", "agents.remediator.main"]
    env_file: .env
    environment:
      ADPROOF_RUNTIME_DIR: /runtime
      OLLAMA_BASE_URL: http://ollama:11434
      VERIFIER_HOST: verifier
      ORCHESTRATOR_HOST: orchestrator
      REMEDIATOR_HOST: remediator
    volumes:
      - runtime:/runtime
    depends_on:
      runtime-prepare:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  generator:
    build: .
    command: ["uv", "run", "python", "-m", "agents.generator.main"]
    env_file: .env
    environment:
      ADPROOF_RUNTIME_DIR: /runtime
      OLLAMA_BASE_URL: http://ollama:11434
      GENERATOR_HOST: generator
      ORCHESTRATOR_HOST: orchestrator
      VERIFIER_HOST: verifier
      REMEDIATOR_HOST: remediator
    volumes:
      - runtime:/runtime
    depends_on:
      runtime-prepare:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8103/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  orchestrator:
    build: .
    command: ["uv", "run", "python", "-m", "agents.orchestrator.main"]
    env_file: .env
    environment:
      ADPROOF_RUNTIME_DIR: /runtime
      ADPROOF_MAILBOX_ENABLED: ${ADPROOF_MAILBOX_ENABLED:-0}
      OLLAMA_BASE_URL: http://ollama:11434
      ORCHESTRATOR_HOST: orchestrator
      VERIFIER_HOST: verifier
      REMEDIATOR_HOST: remediator
      GENERATOR_HOST: generator
    volumes:
      - runtime:/runtime
    ports:
      - "8100:8100"
    depends_on:
      runtime-prepare:
        condition: service_completed_successfully
      verifier:
        condition: service_healthy
      remediator:
        condition: service_healthy
      generator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  runtime:
  ollama_models:
